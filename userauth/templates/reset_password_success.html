{% load static %}
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Password Reset Successful | MantraPOS</title>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;500;600;700&display=swap" rel="stylesheet">
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }
        body {
            font-family: 'Outfit', sans-serif;
            background-color: #f8fafc;
            color: #1e293b;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
        }
        .success-card {
            background-color: #ffffff;
            width: 100%;
            max-width: 480px;
            padding: 60px 40px;
            border-radius: 16px;
            box-shadow: 0 10px 25px -5px rgba(0, 0, 0, 0.05), 0 8px 10px -6px rgba(0, 0, 0, 0.01);
            text-align: center;
            position: relative;
            overflow: hidden;
        }
        .success-card::before {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 6px;
            background: linear-gradient(90deg, #10b981, #34d399);
        }
        .brand-logo {
            margin-bottom: 30px;
        }
        .brand-logo img {
            height: 48px;
            width: auto;
        }
        .icon-wrapper {
            width: 80px;
            height: 80px;
            background-color: #ecfdf5;
            border-radius: 50%;
            display: flex;
            justify-content: center;
            align-items: center;
            margin: 0 auto 24px auto;
        }
        .icon-wrapper svg {
            width: 40px;
            height: 40px;
            color: #10b981;
        }
        h2 {
            font-size: 28px;
            font-weight: 700;
            color: #0f172a;
            margin-bottom: 12px;
        }
        p {
            font-size: 16px;
            color: #64748b;
            line-height: 1.6;
            margin-bottom: 32px;
        }
        .loader {
            width: 32px;
            height: 32px;
            border: 3px solid #e2e8f0;
            border-top-color: #0284c7;
            border-radius: 50%;
            animation: spin 1s linear infinite;
            margin: 0 auto;
        }
        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }
        .footer-logo {
            margin-top: 50px;
        }
        .footer-logo p {
            font-size: 12px;
            color: #94a3b8;
            margin-bottom: 8px;
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }
        .footer-logo img {
            height: 24px;
            opacity: 0.6;
        }
    </style>
    <script>
        setTimeout(function() {
            window.location.href = "https://panel.mantrapos.com/";
        }, 3000);
    </script>
</head>
<body>
    <div class="success-card">
        <div class="brand-logo">
            <img src="{% static 'mantra-logo-white.png' %}" alt="MantraPOS">
        </div>
        
        <div class="icon-wrapper">
            <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2.5">
                <path stroke-linecap="round" stroke-linejoin="round" d="M5 13l4 4L19 7" />
            </svg>
        </div>
        
        <h2>Password Updated!</h2>
        <p>Your password has been successfully reset. You can now use your new password to log in.</p>
        
        <div class="loader"></div>
        <p style="font-size: 14px; margin-top: 16px; margin-bottom: 0;">Redirecting to dashboard...</p>
        
        <div class="footer-logo">
            <p>Powered by</p>
            <img src="{% static 'vibrant-logo.png' %}" alt="Vibrant Digitech">
        </div>
    </div>
</body>
</html>
